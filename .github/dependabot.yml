version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Expo's supported native versions are declared in package.json.
    # Update within those ranges; SDK/native upgrades need expo install --fix.
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@babel/core'
        update-types: [version-update:semver-major]
    groups:
      expo:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - react
          - react-dom
          - '@types/react'
          - react-native
          - react-native-*
          - '@react-native*/*'

        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
