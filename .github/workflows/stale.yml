name: NoX Finance - Stale Issues and Pull Requests

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,bug,keep-open
          exempt-pr-labels: security,bug,keep-open
          exempt-all-assignees: true
          exempt-draft-pr: true
          remove-stale-when-updated: true
          operations-per-run: 30
          stale-issue-message: >
            This NoX Finance issue has been marked as stale after 14 days without activity.
            If the problem persists, please update the app/device version and the outcome without sharing personal data.
            The issue will be closed if there is no further activity within 7 days.
          stale-pr-message: >
            This NoX Finance pull request has had no activity for 14 days. Please provide an update if work is ongoing.
            It will be closed if there is no further activity within 7 days.
          close-issue-message: >
            This issue was automatically closed because there was no further activity during the notice period.
            If the problem persists, you can open a new issue with updated details.
          close-pr-message: >
            This pull request was automatically closed because there was no further activity during the notice period.
            You can reopen it if work is continuing.
